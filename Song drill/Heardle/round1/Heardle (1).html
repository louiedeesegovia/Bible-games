<meta charset="UTF-8">

<style>
  :root{
    --bg:#0c0c0c;
    --panel:#151515;
    --line:#3a3a3a;
    --line-soft:#2a2a2a;
    --text:#f2f2f2;
    --text-dim:#9a9a9a;
    --green:#3aa655;
    --green-bright:#4cc766;
    --red:#c0463f;
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Georgia','Times New Roman',serif;
    height:100%;
  }
  .app{
    max-width:600px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    display:flex;
    flex-direction:column;
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line-soft);
  }
  .header-main{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
  }
  header .icons{
    display:flex;
    gap:14px;
    align-items:center;
  }
  header .icons.right{justify-content:flex-end;}
  .icon-btn{
    width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text);
    background:none;border:none;cursor:pointer;
    opacity:0.9;
  }
  .icon-btn:hover{opacity:1;}
  h1.logo{
    font-size:2rem;
    letter-spacing:0.5px;
    margin:0;
    font-weight:700;
    font-family:'Playfair Display','Georgia',serif;
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:24px 20px 0;
  }
  
  /* Category Grid Styles */
  .category-screen {
    padding: 20px 0;
  }
  .category-screen h2 {
    text-align: center;
    font-family: 'Playfair Display', serif;
    margin-bottom: 24px;
    color: var(--text);
  }
  .category-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .category-column-title {
    text-align: center;
    font-weight: bold;
    font-size: 0.9rem;
    color: gold;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
    text-transform: uppercase;
  }
  .category-card {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 20px 10px;
    text-align: center;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    color: var(--text);
    font-size: 1rem;
    transition: all 0.2s ease;
  }
  .category-card:hover {
    background: var(--green);
    border-color: var(--green-bright);
    transform: translateY(-2px);
  }

  .category-card.completed {
    background: #555;
    color: #aaa;
    border-color: #777;
    cursor: not-allowed;
    pointer-events: none;
  }

  .category-card.completed:hover {
    transform: none;
    background: #555;
  }
  
  .guess-list{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:20px;
  }
  .guess-row{
    border:1px solid var(--line);
    border-radius:2px;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    font-size:1rem;
    color:var(--text-dim);
    transition:border-color .25s, background .25s;
  }
  .guess-row.filled{color:var(--text);}
  .guess-row.correct{
    border-color:var(--green);
    background:rgba(58,166,85,0.12);
    color:var(--text);
  }
  .guess-row.wrong{
    border-color:var(--red);
    background:rgba(192,70,63,0.10);
    color:var(--text);
  }
  .guess-row.skipped{
    color:var(--text-dim);
    font-style:italic;
  }
  .guess-row .mark{
    font-size:1.1rem;
  }
  .spacer{flex:1;}

  .progress-track{
    display:flex;
    height:8px;
    border:1px solid var(--line-soft);
    overflow:hidden;
    margin-bottom:0;
  }
  .segment{
    position:relative;
    height:100%;
    background:transparent;
    border-right:1px solid var(--line-soft);
  }
  .segment:last-child{border-right:none;}
  .segment-fill{
    position:absolute;
    left:0;top:0;bottom:0;
    width:0%;
    background:var(--green-bright);
  }
  .segment.done .segment-fill{width:100%;}

  .player{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 4px 22px;
  }
  .time{
    font-variant-numeric: tabular-nums;
    color:var(--text-dim);
    font-size:0.95rem;
    width:44px;
  }
  .time.right{text-align:right;}
  .play-btn{
    width:64px;height:64px;
    border-radius:50%;
    border:1.5px solid var(--text);
    background:none;
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:1.4rem;
  }
  .play-btn:hover{background:rgba(255,255,255,0.06);}
  .play-btn:disabled{opacity:0.35;cursor:not-allowed;}

  .search-wrap{
    position:relative;
    margin-bottom:14px;
  }
  input.search{
    width:100%;
    padding:16px 18px;
    font-size:1rem;
    border:none;
    border-radius:2px;
    background:var(--white);
    color:#111;
    font-family:inherit;
  }
  input.search:disabled{
    background:#cfcfcf;
    color:#666;
  }
  input.search::placeholder{color:#666;}
  .suggestions{
    position:absolute;
    left:0;right:0;
    top:calc(100% + 4px);
    background:var(--white);
    color:#111;
    border-radius:2px;
    max-height:220px;
    overflow-y:auto;
    z-index:5;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
  }
  .suggestion{
    padding:12px 18px;
    cursor:pointer;
    border-bottom:1px solid #eaeaea;
    font-size:0.95rem;
  }
  .suggestion:last-child{border-bottom:none;}
  .suggestion:hover, .suggestion.active{background:#f0f0f0;}
  .suggestion .artist{color:#777;font-size:0.85rem;}

  .actions{
    display:flex;
    gap:12px;
    padding-bottom:24px;
  }
  .btn{
    flex:1;
    padding:16px 0;
    font-size:0.85rem;
    font-family:inherit;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-weight:700;
    border:none;
    border-radius:2px;
    cursor:pointer;
  }
  .btn-skip{
    background:#3a3a3a;
    color:var(--text);
  }
  .btn-skip:hover{background:#454545;}
  .btn-submit{
    background:var(--green);
    color:#fff;
  }
  .btn-submit:hover{background:var(--green-bright);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  .result-banner{
    text-align:center;
    padding:16px 20px 4px;
    color:var(--text-dim);
    font-size:0.95rem;
    line-height:1.5;
  }
  .result-banner strong{color:var(--text);}
  .result-banner .status{
    font-size:1.3rem;
    display:block;
    margin-bottom:6px;
    font-weight:700;
  }
  .result-banner .status.win{color:var(--green-bright);}
  .result-banner .status.lose{color:var(--red);}

  .new-game{
    display:block;
    margin:14px auto 26px;
    background:none;
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 22px;
    border-radius:2px;
    cursor:pointer;
    font-family:inherit;
    letter-spacing:0.5px;
  }
  .new-game:hover{border-color:var(--text);}

  footer.note{
    text-align:center;
    color:#555;
    font-size:0.75rem;
    padding:6px 20px 20px;
  }

  @media (max-width:480px){
    h1.logo{font-size:1.5rem;}
    .play-btn{width:56px;height:56px;}
    .category-grid { gap: 5px; }
    .category-card { padding: 12px 5px; font-size: 0.85rem; }
  }

/* ---------- Game state ---------- */
const REVEAL_TIMES = [1,2,4,7,11,16];
const TOTAL_TIME = REVEAL_TIMES[REVEAL_TIMES.length-1];
const MAX_GUESSES = REVEAL_TIMES.length;

let currentSong = null;
let currentEvents = null;
let guessIndex = 0;
let gameOver = false;
let audioPlayer = new Audio();
let isPlaying = false;
let playStartCtxTime = 0;
let playCapSeconds = 0;
let rafId = null;
let selectedCategoryButton = null;

let teamScores = { A: 0, B: 0 };
let activeTeam = 'A';
let roundTimeLeft = 45;
let roundTimer = null;

const guessListEl = document.getElementById('guessList');
const progressTrackEl = document.getElementById('progressTrack');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const timeCurEl = document.getElementById('timeCur');
const timeTotalEl = document.getElementById('timeTotal');
const searchInput = document.getElementById('searchInput');
const suggestionsEl = document.getElementById('suggestions');
const skipBtn = document.getElementById('skipBtn');
const submitBtn = document.getElementById('submitBtn');
const resultBanner = document.getElementById('resultBanner');
const newGameBtn = document.getElementById('newGameBtn');
const categoryScreen = document.getElementById('categoryScreen');
const playArea = document.getElementById('playArea');
const gridButtons = document.getElementById('gridButtons');
const trackInfoBanner = document.getElementById('trackInfoBanner');

function fmtTime(s){
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s/60);
  const sec = s%60;
  return m + ":" + String(sec).padStart(2,'0');
}

function startRoundTimer() {

    clearInterval(roundTimer);

    roundTimeLeft = 45;

    updateRoundTimer();

    roundTimer = setInterval(() => {

        roundTimeLeft--;

        updateRoundTimer();

        if (roundTimeLeft <= 0) {

            clearInterval(roundTimer);

            stopPlayback();

            endGame(false);

        }

    }, 1000);
}

function stopRoundTimer() {
    clearInterval(roundTimer);
}

function updateRoundTimer() {

    const m = Math.floor(roundTimeLeft / 60);
    const s = roundTimeLeft % 60;

    const timer = document.getElementById("roundTimer");

    timer.textContent =
        `${m}:${String(s).padStart(2,"0")}`;

    if (roundTimeLeft <= 10) {
        timer.style.color = "red";
    } else if (roundTimeLeft <= 20) {
        timer.style.color = "orange";
    } else {
        timer.style.color = "#4cc766";
    }
}

document.getElementById("teamADisplay").addEventListener("click", () => {
    setActiveTeam("A");
});

document.getElementById("teamBDisplay").addEventListener("click", () => {
    setActiveTeam("B");
});

/* ---------- Render Grid Initial Selection Screen ---------- */
function initCategoryGrid() {
  gridButtons.innerHTML = '';
  const categories = ["Hymnal", "Special Song", "Children Song", "Bisaya"];
  
  // Render 7 rows of selection cards
  for (let row = 0; row < 7; row++) {
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'category-card';
      btn.textContent = (row + 1);
      btn.addEventListener('click', () => {
        selectedCategoryButton = btn;
        selectTrack(cat, row);
      });
      gridButtons.appendChild(btn);
    });
  }
}

function selectTrack(category, index) {
  const categoryPool = SONGS_DATABASE[category];
  currentSong = categoryPool[index];
  
  // Update banner context labels
  trackInfoBanner.textContent = `Category: ${category} — Track #${index + 1}`;
  
  // UI Switch screens
  categoryScreen.style.display = 'none';
  playArea.style.display = 'block';
  
  // Load track parameters
  currentEvents = null;
  guessIndex = 0;
  gameOver = false;
  buildBoardUI();
  updateSegmentsForGuess(0,0);
  timeCurEl.textContent = '0:00';
  timeTotalEl.textContent = fmtTime(TOTAL_TIME);
  resultBanner.style.display = 'none';
  newGameBtn.style.display = 'none';
  searchInput.disabled = false;
  searchInput.value = '';
  submitBtn.disabled = false;
  skipBtn.disabled = false;
  playBtn.disabled = false;
  updateSkipLabel();
  suggestionsEl.style.display = 'none';
  startRoundTimer();
}

function buildBoardUI(){
  guessListEl.innerHTML = '';
  for(let i=0;i<MAX_GUESSES;i++){
    const row = document.createElement('div');
    row.className = 'guess-row';
    row.id = 'guessRow'+i;
    row.innerHTML = '<span class="label"></span><span class="mark"></span>';
    guessListEl.appendChild(row);
  }
  progressTrackEl.innerHTML = '';
  const segDurations = [];
  let prev = 0;
  for(const t of REVEAL_TIMES){ segDurations.push(t-prev); prev = t; }
  for(let i=0;i<segDurations.length;i++){
    const seg = document.createElement('div');
    seg.className = 'segment';
    seg.style.flex = segDurations[i];
    seg.id = 'segment'+i;
    const fill = document.createElement('div');
    fill.className = 'segment-fill';
    fill.id = 'segmentFill'+i;
    seg.appendChild(fill);
    progressTrackEl.appendChild(seg);
  }
}

function updateSegmentsForGuess(idx, currentPlaySeconds){
  const segDurations = [];
  let prev = 0;
  for(const t of REVEAL_TIMES){ segDurations.push(t-prev); prev = t; }
  let cumulative = 0;
  for(let i=0;i<segDurations.length;i++){
    const segStart = cumulative;
    const segEnd = cumulative + segDurations[i];
    const fillEl = document.getElementById('segmentFill'+i);
    if(currentPlaySeconds >= segEnd){
      fillEl.style.width = '100%';
    } else if(currentPlaySeconds > segStart){
      const pct = ((currentPlaySeconds - segStart)/segDurations[i])*100;
      fillEl.style.width = pct+'%';
    } else {
      fillEl.style.width = '0%';
    }
    cumulative = segEnd;
  }
}

function updateSkipLabel(){
  const nextIdx = guessIndex+1;
  if(nextIdx >= MAX_GUESSES){
    skipBtn.textContent = 'Skip';
  } else {
    const added = REVEAL_TIMES[nextIdx] - REVEAL_TIMES[guessIndex];
    skipBtn.textContent = 'Skip (+'+added+'s)';
  }
}

function currentCap(){
  return REVEAL_TIMES[guessIndex];
}

/* ---------- Audio playback synthesis engines ---------- */

function stopPlayback() {

    isPlaying = false;

    audioPlayer.pause();

    audioPlayer.currentTime = 0;

    playIcon.style.display = "inline";
    pauseIcon.style.display = "none";

}

function playClip() {

    if (!currentSong.src) {
        alert("No audio file found.");
        return;
    }

    stopPlayback();

    audioPlayer.src = currentSong.src;

    audioPlayer.currentTime = 0;

    isPlaying = true;

    playIcon.style.display = "none";
    pauseIcon.style.display = "inline";

    const cap = currentCap();

    audioPlayer.play();

    const timer = setInterval(() => {

        timeCurEl.textContent = fmtTime(audioPlayer.currentTime);

        updateSegmentsForGuess(guessIndex, audioPlayer.currentTime);

        if (audioPlayer.currentTime >= cap) {

            audioPlayer.pause();

            audioPlayer.currentTime = 0;

            stopPlayback();

            clearInterval(timer);

        }

    }, 30);

}

playBtn.addEventListener('click', () => {
  if(gameOver) return;
  if(isPlaying){ stopPlayback(); } else { playClip(); }
});

/* ---------- Search Engine / Autocomplete Array Parsing ---------- */
let activeSuggestionIdx = -1;
let filteredSongs = [];

function normalize(s){
  return s.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
}

searchInput.addEventListener('input', () => {
  const q = normalize(searchInput.value);
  activeSuggestionIdx = -1;
  if(!q){
    suggestionsEl.style.display = 'none';
    filteredSongs = [];
    return;
  }
  filteredSongs = SEARCH_POOL.filter(s =>
    normalize(s.title).includes(q)
  ).slice(0,8);
  renderSuggestions();
});

function renderSuggestions(){
  if(filteredSongs.length === 0){
    suggestionsEl.style.display = 'none';
    return;
  }
  suggestionsEl.innerHTML = '';
  filteredSongs.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'suggestion' + (i===activeSuggestionIdx ? ' active' : '');
    div.innerHTML = '<div>'+s.title+'</div>';
    div.addEventListener('mousedown', (e) => {
      e.preventDefault();
      searchInput.value = s.title;
      suggestionsEl.style.display = 'none';
    });
    suggestionsEl.appendChild(div);
  });
  suggestionsEl.style.display = 'block';
}

searchInput.addEventListener('keydown', (e) => {
  if(suggestionsEl.style.display === 'block'){
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      activeSuggestionIdx = Math.min(activeSuggestionIdx+1, filteredSongs.length-1);
      renderSuggestions();
      return;
    }
    if(e.key === 'ArrowUp'){
      e.preventDefault();
      activeSuggestionIdx = Math.max(activeSuggestionIdx-1, 0);
      renderSuggestions();
      return;
    }
    if(e.key === 'Enter' && activeSuggestionIdx >= 0){
      e.preventDefault();
      searchInput.value = filteredSongs[activeSuggestionIdx].title;
      suggestionsEl.style.display = 'none';
      return;
    }
  }
  if(e.key === 'Enter'){ submitGuess(); }
});

document.addEventListener('click', (e) => {
  if(!e.target.closest('.search-wrap')){ suggestionsEl.style.display = 'none'; }
});

/* ---------- Guess & Team Handlers ---------- */
function fillRow(idx, text, state){
  const row = document.getElementById('guessRow'+idx);
  row.classList.add('filled');
  if(state) row.classList.add(state);
  const label = row.querySelector('.label');
  label.textContent = text;
  const mark = row.querySelector('.mark');
  if(state === 'correct') mark.textContent = '\u2713';
  else if(state === 'wrong') mark.textContent = '\u2717';
  else mark.textContent = '';
}

function toggleTeam() {
    setActiveTeam(activeTeam === "A" ? "B" : "A");
}

function endGame(won){
  stopRoundTimer();
  gameOver = true;
  stopPlayback();
  searchInput.disabled = true;
  submitBtn.disabled = true;
  skipBtn.disabled = true;
  resultBanner.style.display = 'block';
  
  if(won){
    let pointsEarned = MAX_GUESSES - guessIndex;
    teamScores[activeTeam] += pointsEarned;
    
    document.getElementById('teamAScore').textContent = teamScores.A;
    document.getElementById('teamBScore').textContent = teamScores.B;

    resultBanner.innerHTML = '<span class="status win">Team ' + activeTeam + ' Scores! (+' + pointsEarned + ' pts)</span>Answer: <strong>'+currentSong.title+'</strong>';
  } else {
    resultBanner.innerHTML = '<span class="status lose">Out of guesses</span>The correct song was <strong>'+currentSong.title+'</strong>';
  }
  newGameBtn.style.display = 'block';
  updateSegmentsForGuess(MAX_GUESSES-1, TOTAL_TIME);
  timeCurEl.textContent = fmtTime(TOTAL_TIME);

  if (selectedCategoryButton) {
    selectedCategoryButton.classList.add("completed");
  }
}

function advanceGuess(labelText, state){
  fillRow(guessIndex, labelText, state);
  if(state === 'correct'){
    endGame(true);
    return;
  }
  
  guessIndex++;
  if(guessIndex >= MAX_GUESSES){
    endGame(false);
    return;
  }
  
  toggleTeam();
  updateSkipLabel();
  updateSegmentsForGuess(guessIndex, 0);
  timeCurEl.textContent = '0:00';
}

function submitGuess(){
  if(gameOver) return;
  const raw = searchInput.value.trim();
  if(!raw){ searchInput.focus(); return; }
  const guessNorm = normalize(raw);
  const isCorrect = guessNorm === normalize(currentSong.title);
  advanceGuess(raw, isCorrect ? 'correct' : 'wrong');
  searchInput.value = '';
  suggestionsEl.style.display = 'none';
}

function setActiveTeam(team) {

    activeTeam = team;

    document.getElementById("currentTeamName").textContent = "Team " + team;

    if (team === "A") {

        document.getElementById("teamADisplay").style.borderColor = "var(--green)";
        document.getElementById("teamBDisplay").style.borderColor = "transparent";

        document.getElementById("teamAScore").style.color = "var(--green-bright)";
        document.getElementById("teamBScore").style.color = "var(--text-dim)";

    } else {

        document.getElementById("teamBDisplay").style.borderColor = "var(--green)";
        document.getElementById("teamADisplay").style.borderColor = "transparent";

        document.getElementById("teamBScore").style.color = "var(--green-bright)";
        document.getElementById("teamAScore").style.color = "var(--text-dim)";
    }
}

submitBtn.addEventListener('click', submitGuess);

skipBtn.addEventListener('click', () => {
  if(gameOver) return;
  advanceGuess('Skipped', 'skipped');
  searchInput.value = '';
});

newGameBtn.addEventListener('click', () => {
  stopPlayback();
  playArea.style.display = 'none';
  categoryScreen.style.display = 'block';
  stopRoundTimer();
  document.getElementById("roundTimer").textContent = "0:45";
});

document.getElementById('infoBtn').addEventListener('click', () => {
  alert('Choose a category block! Play the audio and turn-by-turn guess the song. Point scales reduce if sections are skipped.');
});
document.getElementById('helpBtn').addEventListener('click', () => {
  alert('1. Listen to audio snippets\n2. Type answers into lookup inputs\n3. Wrong answers rotate team priority metrics');
});

/* ---------- Init Display Grid Default Setup ---------- */
initCategoryGrid();
</script>
